services:
  - type: web
    name: origincards
    runtime: python
    buildCommand: pip install -r OriginCards/requirements.txt
    startCommand: uvicorn OriginCards.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: origincards-db
          property: connectionString

databases:
  - name: origincards-db
    plan: free
