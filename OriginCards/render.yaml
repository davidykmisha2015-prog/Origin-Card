services:
  - type: web
    name: origincards
    runtime: python
    buildCommand: pip install -r OriginCards/requirements.txt
    startCommand: uvicorn OriginCards.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: origincards-db
          property: connectionString
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: https://origincards.onrender.com/auth/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://origincards.onrender.com/auth/google/callback

databases:
  - name: origincards-db
    plan: free
